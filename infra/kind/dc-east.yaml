# Forge data center: dc-east
# One control-plane node and two workers. Each node is a Docker container
# standing in for a bare-metal host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dc-east
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx will listen on the node's 80/443; publish them to the
      # host so dc-east is reachable at localhost:8080 / localhost:8443.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      forge.io/rack: rack-1
      topology.kubernetes.io/zone: dc-east
  - role: worker
    labels:
      forge.io/rack: rack-2
      topology.kubernetes.io/zone: dc-east
