apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app: chat
    tenant: acme
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
        tenant: acme
    spec:
      containers:
        - name: fake-inference
          image: forge/fake-inference:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: acme-chat-1