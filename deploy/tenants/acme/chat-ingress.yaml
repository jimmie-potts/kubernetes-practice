apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat
  labels:
    tenant: acme
spec:
  ingressClassName: nginx
  rules:
    - host: chat.acme.dc-east.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: 80